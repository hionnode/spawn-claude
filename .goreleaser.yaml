version: 2

project_name: spawn-claude

before:
  hooks:
    - go mod tidy

builds:
  - id: spawn-claude
    main: .
    binary: spawn-claude
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - arm64
    ldflags:
      - -s -w
      - -X github.com/hionnode/spawn-claude/internal/buildinfo.Version={{ .Version }}

archives:
  - id: spawn-claude
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
      - "^ci:"

release:
  draft: false
  prerelease: auto
